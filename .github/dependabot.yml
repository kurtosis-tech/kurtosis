version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/api/golang"
      - "/cli/cli"
      - "/cloud/api/golang"
      - "/connect-server"
      - "/container-engine-lib"
      - "/contexts-config-store"
      - "/core/files_artifacts_expander"
      - "/core/launcher"
      - "/core/server"
      - "/enclave-manager/api/golang"
      - "/enclave-manager/server"
      - "/engine/launcher"
      - "/engine/server"
      - "/grpc-file-transfer/golang"
      - "/internal_testsuites/golang"
      - "/kurtosis_version"
      - "/metrics-library/golang"
      - "/name_generator"
      - "/path-compression"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directories:
      - "/api/typescript"
      - "/docs"
      - "/enclave-manager/web"
      - "/internal_testsuites/typescript"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
