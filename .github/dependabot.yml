version: 2

multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directories:
      - "/api/golang"
      - "/cli/cli"
      - "/cloud/api/golang"
      - "/connect-server"
      - "/container-engine-lib"
      - "/contexts-config-store"
      - "/core/files_artifacts_expander"
      - "/core/launcher"
      - "/core/server"
      - "/enclave-manager/api/golang"
      - "/enclave-manager/server"
      - "/engine/launcher"
      - "/engine/server"
      - "/grpc-file-transfer/golang"
      - "/internal_testsuites/golang"
      - "/kurtosis_version"
      - "/metrics-library/golang"
      - "/name_generator"
      - "/path-compression"
    patterns:
      - "*"
    multi-ecosystem-group: "all-deps"

  - package-ecosystem: "npm"
    directories:
      - "/api/typescript"
      - "/docs"
      - "/enclave-manager/web"
      - "/internal_testsuites/typescript"
    patterns:
      - "*"
    multi-ecosystem-group: "all-deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-deps"
